<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Audit App</title>
    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary: #0056b3;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #dddddd;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            overscroll-behavior-y: contain; /* Prevents pull-to-refresh on mobile */
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Views */
        .view { display: none; flex: 1; flex-direction: column; }
        .view.active { display: flex; }

        /* Card Styles */
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        h1, h2, h3 { margin-top: 0; color: var(--primary); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;}
        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; box-sizing: border-box; font-family: inherit;
        }
        
        /* Buttons */
        button {
            padding: 12px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
            transition: background 0.2s; color: white; width: 100%; margin-bottom: 10px; font-size: 16px;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary); }
        .btn-success { background-color: var(--success); }
        .btn-warning { background-color: var(--warning); color: #000; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-outline { background-color: transparent; border: 2px solid var(--primary); color: var(--primary); }
        
        /* Nav Buttons Group */
        .nav-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .nav-buttons button { margin-bottom: 0; }

        /* Radio Buttons for Compliance */
        .radio-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .radio-option {
            display: flex; align-items: center; padding: 10px; border: 1px solid var(--border);
            border-radius: 5px; cursor: pointer; transition: 0.2s;
        }
        .radio-option input { margin-right: 10px; transform: scale(1.2); }
        .radio-option.selected { border-color: var(--primary); background: #eef5ff; }

        /* Badges */
        .badge {
            display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold;
            background: #eee; margin-right: 5px; margin-bottom: 10px;
        }
        .badge-hse { background: var(--danger); color: white; }

        /* Image Preview */
        .image-preview {
            max-width: 100%; max-height: 200px; border-radius: 5px; display: none; margin-top: 10px;
        }

        #loading-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <h3 id="loading-text">Loading System...</h3>
    </div>

    <div class="container">
        
        <!-- 1. START VIEW (Metadata) -->
        <div id="start-view" class="view">
            <div class="card">
                <h2>New Store Audit</h2>
                <div class="form-group">
                    <label>Store Name</label>
                    <input type="text" id="meta-store-name" placeholder="Enter Store Name">
                </div>
                <div class="form-group">
                    <label>Store Code</label>
                    <input type="text" id="meta-store-code" placeholder="Enter Store Code">
                </div>
                <div class="form-group">
                    <label>Checked By (Auditor)</label>
                    <input type="text" id="meta-auditor" placeholder="Auditor Name">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="meta-date">
                </div>
                <button class="btn-primary" onclick="startAudit()">Start Audit</button>
            </div>

            <div class="card">
                <h3>View Past Audit</h3>
                <div class="form-group">
                    <input type="text" id="search-audit-id" placeholder="e.g. 260728-8A3F">
                </div>
                <button class="btn-outline" onclick="fetchPastAudit()">Search</button>
            </div>
        </div>

        <!-- 2. AUDIT QUESTION VIEW -->
        <div id="audit-view" class="view">
            <!-- Progress text -->
            <p style="text-align: center; color: #666; font-weight: bold; margin-bottom: 10px;" id="q-progress">Question 1 of 45</p>
            
            <div class="card" id="swipe-area">
                <div id="q-badges"></div>
                <h3 id="q-text" style="font-size: 18px; line-height: 1.4; margin-bottom: 20px;"></h3>
                
                <div class="radio-group" id="q-options">
                    <label class="radio-option" id="lbl-comp"><input type="radio" name="compliance" value="1"> Compliance (1)</label>
                    <label class="radio-option" id="lbl-part"><input type="radio" name="compliance" value="0.5"> Partial Compliance (0.5)</label>
                    <label class="radio-option" id="lbl-non"><input type="radio" name="compliance" value="0"> Non Compliance (0)</label>
                    <label class="radio-option" id="lbl-na"><input type="radio" name="compliance" value="NA"> N/A (Not Applicable)</label>
                </div>

                <div class="form-group">
                    <label>Remarks / Findings</label>
                    <textarea id="q-remarks" rows="3" placeholder="Enter details here..."></textarea>
                </div>

                <div class="form-group">
                    <label>Evidence Picture (Optional)</label>
                    
                    <!-- WhatsApp Style Buttons -->
                    <div id="image-controls" style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <button type="button" class="btn-outline" onclick="document.getElementById('q-image-cam').click()" style="margin: 0;">📷 Camera</button>
                        <button type="button" class="btn-outline" onclick="document.getElementById('q-image-gal').click()" style="margin: 0;">🖼️ Gallery</button>
                    </div>
                    
                    <!-- Hidden Inputs -->
                    <input type="file" id="q-image-cam" accept="image/*" capture="environment" style="display:none;">
                    <input type="file" id="q-image-gal" accept="image/*" style="display:none;">
                    
                    <img id="q-image-preview" class="image-preview" src="">
                    <button type="button" id="btn-remove-img" class="btn-danger" style="display: none; margin-top: 10px;" onclick="removeImage()">🗑️ Remove Image</button>
                </div>
                
                <div class="nav-buttons" id="action-buttons">
                    <button class="btn-success" id="btn-confirm" onclick="confirmAnswer()">Confirm</button>
                    <button class="btn-warning" id="btn-edit" onclick="editAnswer()" style="display:none;">Edit</button>
                </div>
            </div>

            <div class="nav-buttons">
                <button class="btn-outline" id="btn-prev" onclick="navigate(-1)">Previous</button>
                <button class="btn-primary" id="btn-next" onclick="navigate(1)">Next</button>
            </div>
        </div>

        <!-- 3. SUMMARY & SUBMIT VIEW -->
        <div id="summary-view" class="view">
            <div class="card">
                <h2>Audit Summary</h2>
                <h1 style="font-size: 48px; text-align: center; margin: 20px 0;" id="final-score">0 / 0</h1>
                
                <div class="form-group">
                    <label>Special Comment (Overall)</label>
                    <textarea id="special-comment" rows="4" placeholder="Any final thoughts on the audit..."></textarea>
                </div>

                <button class="btn-success" id="btn-submit" onclick="submitAudit()">Submit & Download PDF</button>
                <button class="btn-outline" onclick="goToQuestion(0)">Back to Review Questions</button>
            </div>
        </div>

        <!-- 4. SUCCESS VIEW -->
        <div id="success-view" class="view">
            <div class="card" style="text-align: center; padding: 40px 20px;">
                <h1 style="color: var(--success); font-size: 60px; margin-bottom: 10px;">✓</h1>
                <h2>Audit Submitted!</h2>
                <p>Your unique reference number is:</p>
                <h3 id="display-audit-id" style="background: #eee; padding: 10px; border-radius: 5px;"></h3>
                <p style="font-size: 14px; color: #666; margin-top: 20px;">The PDF report has been downloaded to your device.</p>
                <button class="btn-primary" style="margin-top: 30px;" onclick="location.reload()">Start New Audit</button>
            </div>
        </div>

    </div>

<script>
    // System Constants & State
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyaZuYo5az-x32YBaswjpx8e9gPJglS8Z1iw72F9t_o_1mMnVsDyHxwspas3QMQQpng0g/exec';
    
    let questions = [];
    let auditData = { answers: {} }; 
    let currentIndex = 0;
    let isReadOnlyMode = false; 

    // --- INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('meta-date').valueAsDate = new Date();
        fetchQuestions();
        setupSwipe();
        setupRadioStyling();
        setupImageCompression();
    });

    // Generates a short, collision-proof ID (e.g., 260728-8A3F)
    function generateUniqueId() {
        const now = new Date();
        const yy = now.getFullYear().toString().slice(-2);
        const mm = (now.getMonth() + 1).toString().padStart(2, '0');
        const dd = now.getDate().toString().padStart(2, '0');
        const randomPart = Math.random().toString(36).substring(2, 6).toUpperCase();
        return `${yy}${mm}${dd}-${randomPart}`;
    }

    async function fetchQuestions() {
        const cachedQ = localStorage.getItem('auditQuestions');
        if (cachedQ) {
            questions = JSON.parse(cachedQ);
            switchView('start-view');
            hideLoading();
            checkPendingSubmissions(); 
            checkDraft(); 
        } else {
            showLoading("Fetching Questions for the first time...");
        }

        try {
            const response = await fetch(SCRIPT_URL);
            const fetchedQuestions = await response.json();
            
            localStorage.setItem('auditQuestions', JSON.stringify(fetchedQuestions));
            
            if (!cachedQ) {
                questions = fetchedQuestions;
                hideLoading();
                switchView('start-view');
            }
        } catch (error) {
            hideLoading();
            if (!cachedQ) {
                alert("You are offline and have no cached questions. Please connect to the internet to initialize the app.");
            }
        }
    }

    async function checkPendingSubmissions() {
        let queue = JSON.parse(localStorage.getItem('auditQueue') || '[]');
        if (queue.length === 0) return;

        console.log(`Attempting to sync ${queue.length} offline audits...`);
        let failedQueue = [];

        for (let i = 0; i < queue.length; i++) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(queue[i])
                });
                const result = await response.json();
                if (result.success) {
                    console.log("Offline audit synced successfully: " + result.auditId);
                } else {
                    failedQueue.push(queue[i]);
                }
            } catch (e) {
                failedQueue.push(queue[i]); 
            }
        }

        localStorage.setItem('auditQueue', JSON.stringify(failedQueue));
        
        if (failedQueue.length < queue.length) {
            alert(`${queue.length - failedQueue.length} offline audit(s) just successfully synced to the database!`);
        }
    }

    function checkDraft() {
        const draft = localStorage.getItem('auditDraft');
        if (draft) {
            if (confirm("You have an unfinished audit. Would you like to resume it?")) {
                auditData = JSON.parse(draft);
                currentIndex = 0; 
                isReadOnlyMode = false;
                
                document.getElementById('meta-store-name').value = auditData.metadata.storeName || '';
                document.getElementById('meta-store-code').value = auditData.metadata.storeCode || '';
                document.getElementById('meta-auditor').value = auditData.metadata.auditor || '';
                document.getElementById('meta-date').value = auditData.metadata.date || '';
                
                renderQuestion();
                switchView('audit-view');
            } else {
                localStorage.removeItem('auditDraft'); 
            }
        }
    }

    // --- NAVIGATION LOGIC ---
    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    function startAudit() {
        const sName = document.getElementById('meta-store-name').value;
        const sCode = document.getElementById('meta-store-code').value;
        const auditor = document.getElementById('meta-auditor').value;
        
        if(!sName || !sCode || !auditor) return alert("Please fill Store Name, Code, and Auditor");

        auditData.metadata = {
            auditId: generateUniqueId(),
            storeName: sName,
            storeCode: sCode,
            auditor: auditor,
            date: document.getElementById('meta-date').value
        };
        
        currentIndex = 0;
        isReadOnlyMode = false;
        
        localStorage.setItem('auditDraft', JSON.stringify(auditData));
        
        renderQuestion();
        switchView('audit-view');
    }

    function renderQuestion() {
        if(currentIndex >= questions.length) {
            calculateAndShowSummary();
            return;
        }

        const q = questions[currentIndex];
        const state = auditData.answers[q.srNo] || {};

        document.getElementById('q-progress').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
        document.getElementById('q-text').innerText = `${q.srNo}. ${q.question}`;
        
        let badgesHtml = `<span class="badge">${q.category}</span>`;
        if (q.hse === 'Yes') badgesHtml += `<span class="badge badge-hse">HSE Critical</span>`;
        document.getElementById('q-badges').innerHTML = badgesHtml;

        document.querySelectorAll('input[name="compliance"]').forEach(el => {
            el.checked = false;
            el.parentElement.classList.remove('selected');
        });
        
        document.getElementById('q-remarks').value = state.remarks || '';
        document.getElementById('q-image-cam').value = '';
        document.getElementById('q-image-gal').value = '';
        
        const preview = document.getElementById('q-image-preview');
        const removeBtn = document.getElementById('btn-remove-img');
        
        if (state.imageBase64 || state.imageUrl) {
            preview.src = state.imageBase64 || state.imageUrl;
            preview.style.display = 'block';
            removeBtn.style.display = (state.isConfirmed || isReadOnlyMode) ? 'none' : 'block';
        } else {
            preview.style.display = 'none';
            preview.src = '';
            removeBtn.style.display = 'none';
        }

        if (state.value !== undefined && state.value !== null) {
            const radio = document.querySelector(`input[value="${state.value}"]`);
            if (radio) {
                radio.checked = true;
                radio.parentElement.classList.add('selected');
            }
            if (state.isConfirmed || isReadOnlyMode) disableInputs();
            else enableInputs();
        } else {
            enableInputs();
        }

        document.getElementById('btn-prev').style.display = currentIndex === 0 ? 'none' : 'block';
        document.getElementById('btn-next').innerText = currentIndex === questions.length - 1 ? 'Finish' : 'Next';
        document.getElementById('action-buttons').style.display = isReadOnlyMode ? 'none' : 'flex';
    }

    function navigate(direction) {
        if(direction === 1 && !isReadOnlyMode) {
            const currentQ = questions[currentIndex];
            const state = auditData.answers[currentQ.srNo] || {};
            if(!state.isConfirmed) saveCurrentInput(false);
        }
        
        currentIndex += direction;
        
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex > questions.length) currentIndex = questions.length;
        
        if(currentIndex === questions.length) {
            calculateAndShowSummary();
        } else {
            renderQuestion();
        }
    }

    function goToQuestion(index) {
        currentIndex = index;
        renderQuestion();
        switchView('audit-view');
    }

    // --- QUESTION STATE LOGIC ---
    function saveCurrentInput(isConfirmed) {
        const q = questions[currentIndex];
        const selected = document.querySelector('input[name="compliance"]:checked');
        
        auditData.answers[q.srNo] = {
            srNo: q.srNo,
            question: q.question,
            category: q.category,
            value: selected ? selected.value : null,
            remarks: document.getElementById('q-remarks').value,
            imageBase64: document.getElementById('q-image-preview').src.startsWith('data:') ? document.getElementById('q-image-preview').src : null,
            isConfirmed: isConfirmed
        };

        if (!isReadOnlyMode) {
            localStorage.setItem('auditDraft', JSON.stringify(auditData));
        }
    }

    function confirmAnswer() {
        const selected = document.querySelector('input[name="compliance"]:checked');
        if(!selected) return alert("Please select a compliance option before confirming.");
        saveCurrentInput(true);
        disableInputs();
    }

    function editAnswer() {
        const q = questions[currentIndex];
        if (auditData.answers[q.srNo]) {
            auditData.answers[q.srNo].isConfirmed = false;
        }
        enableInputs();
    }

    function disableInputs() {
        document.querySelectorAll('input[name="compliance"]').forEach(el => el.disabled = true);
        document.getElementById('q-remarks').disabled = true;
        document.getElementById('image-controls').style.display = 'none'; 
        document.getElementById('btn-remove-img').style.display = 'none'; 
        document.getElementById('btn-confirm').style.display = 'none';
        document.getElementById('btn-edit').style.display = 'block';
    }

    function enableInputs() {
        if(isReadOnlyMode) return;
        document.querySelectorAll('input[name="compliance"]').forEach(el => el.disabled = false);
        document.getElementById('q-remarks').disabled = false;
        document.getElementById('image-controls').style.display = 'flex'; 
        
        if (document.getElementById('q-image-preview').src.startsWith('data:')) {
            document.getElementById('btn-remove-img').style.display = 'block';
        }
        
        document.getElementById('btn-confirm').style.display = 'block';
        document.getElementById('btn-edit').style.display = 'none';
    }

    // --- SWIPE & UI HELPERS ---
    function setupSwipe() {
        let touchstartX = 0;
        let touchendX = 0;
        const area = document.getElementById('swipe-area');

        area.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; });
        area.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchendX < touchstartX - 50) navigate(1); 
            if (touchendX > touchstartX + 50) navigate(-1); 
        }
    }

    function setupRadioStyling() {
        document.querySelectorAll('input[name="compliance"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
                if(e.target.checked) e.target.parentElement.classList.add('selected');
            });
        });
    }

    // --- IMAGE COMPRESSION & REMOVAL ---
    function removeImage() {
        document.getElementById('q-image-cam').value = '';
        document.getElementById('q-image-gal').value = '';
        document.getElementById('q-image-preview').src = '';
        document.getElementById('q-image-preview').style.display = 'none';
        document.getElementById('btn-remove-img').style.display = 'none';
        saveCurrentInput(false); 
    }

    function setupImageCompression() {
        const processImage = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    
                    const preview = document.getElementById('q-image-preview');
                    preview.src = dataUrl;
                    preview.style.display = 'block';
                    
                    document.getElementById('btn-remove-img').style.display = 'block';
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        };

        document.getElementById('q-image-cam').addEventListener('change', processImage);
        document.getElementById('q-image-gal').addEventListener('change', processImage);
    }

    // --- SUMMARY & SUBMISSION ---
    function calculateAndShowSummary() {
        let earned = 0;
        let maxScore = 0;
        let unconfirmedCount = 0;

        questions.forEach(q => {
            const state = auditData.answers[q.srNo];
            if (!state || !state.value) {
                unconfirmedCount++;
                return;
            }
            if (state.value !== 'NA') {
                maxScore += 1;
                earned += parseFloat(state.value);
            }
        });

        document.getElementById('final-score').innerText = `${earned} / ${maxScore}`;
        auditData.totalScore = `${earned} / ${maxScore}`;
        
        if (unconfirmedCount > 0 && !isReadOnlyMode) {
            alert(`Warning: You have ${unconfirmedCount} unanswered/unconfirmed questions.`);
        }

        document.getElementById('btn-submit').style.display = isReadOnlyMode ? 'none' : 'block';
        document.getElementById('special-comment').value = auditData.specialComment || '';
        document.getElementById('special-comment').disabled = isReadOnlyMode;

        switchView('summary-view');
    }

    async function submitAudit() {
        auditData.specialComment = document.getElementById('special-comment').value;
        
        const payload = {
            metadata: auditData.metadata,
            storeName: auditData.metadata.storeName,
            storeCode: auditData.metadata.storeCode,
            auditor: auditData.metadata.auditor,
            totalScore: auditData.totalScore,
            specialComment: auditData.specialComment,
            answers: Object.values(auditData.answers)
        };

        showLoading("Uploading Audit...");

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            hideLoading();
            
            if (result.success) {
                localStorage.removeItem('auditDraft'); 
                generatePDF(auditData.metadata.auditId, payload);
                document.getElementById('display-audit-id').innerText = auditData.metadata.auditId;
                switchView('success-view');
            } else {
                alert("Server Error: " + result.error);
            }
        } catch (error) {
            hideLoading();
            
            let queue = JSON.parse(localStorage.getItem('auditQueue') || '[]');
            queue.push(payload);
            localStorage.setItem('auditQueue', JSON.stringify(queue));
            
            localStorage.removeItem('auditDraft'); 
            
            generatePDF(auditData.metadata.auditId, payload);
            
            alert("⚠️ Network offline! Your audit has been saved securely to this device. It will automatically upload next time you open the app with an internet connection. Your PDF has been downloaded.");
            location.reload();
        }
    }

    // --- PDF GENERATION ---
    function generatePDF(auditId, data) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFontSize(18);
        doc.text("Store Audit Report", 14, 20);
        
        doc.setFontSize(10);
        doc.text(`Audit ID: ${auditId}`, 14, 30);
        doc.text(`Store: ${data.storeName} (${data.storeCode})`, 14, 36);
        doc.text(`Auditor: ${data.auditor}`, 14, 42);
        doc.text(`Score: ${data.totalScore}`, 14, 48);
        doc.text(`Date: ${data.metadata.date}`, 14, 54);

        const tableBody = data.answers.map(ans => {
            let status = ans.value;
            if (status === '1') status = 'Compliance';
            else if (status === '0.5') status = 'Partial';
            else if (status === '0') status = 'Non-Comp';

            return [
                ans.srNo,
                ans.category,
                ans.question.substring(0, 80) + '...', 
                status || 'Missed',
                ans.remarks || ''
            ];
        });

        doc.autoTable({
            startY: 60,
            head: [['Sr', 'Category', 'Question Summary', 'Status', 'Remarks']],
            body: tableBody,
            styles: { fontSize: 8 },
            columnStyles: {
                0: { cellWidth: 10 },
                1: { cellWidth: 30 },
                2: { cellWidth: 80 },
                3: { cellWidth: 20 },
                4: { cellWidth: 'auto' }
            }
        });

        let finalY = doc.lastAutoTable.finalY || 60;
        if(finalY > 250) { doc.addPage(); finalY = 20; }
        
        doc.setFontSize(12);
        doc.text("Special Comment:", 14, finalY + 10);
        doc.setFontSize(10);
        doc.text(doc.splitTextToSize(data.specialComment || "None", 180), 14, finalY + 16);

        doc.save(`${auditId}_Report.pdf`);
    }

    // --- PAST AUDITS ---
    async function fetchPastAudit() {
        const id = document.getElementById('search-audit-id').value.trim();
        if(!id) return alert("Enter an Audit ID");

        showLoading("Searching Database...");
        try {
            const response = await fetch(`${SCRIPT_URL}?auditId=${id}`);
            const data = await response.json();
            
            hideLoading();
            
            if (data.error) {
                alert("Audit not found.");
            } else {
                isReadOnlyMode = true;
                
                auditData.metadata = {
                    auditId: id,
                    storeName: data.storeName,
                    storeCode: data.storeCode,
                    auditor: data.auditor,
                    date: data.metadata ? data.metadata.date : ''
                };
                auditData.totalScore = data.totalScore;
                auditData.specialComment = data.specialComment;
                
                auditData.answers = {};
                data.answers.forEach(ans => {
                    auditData.answers[ans.srNo] = ans;
                });

                currentIndex = 0;
                renderQuestion();
                switchView('audit-view');
            }
        } catch (error) {
            hideLoading();
            alert("Error fetching audit.");
        }
    }

    function showLoading(text) {
        document.getElementById('loading-text').innerText = text;
        document.getElementById('loading-overlay').style.display = 'flex';
    }
    function hideLoading() {
        document.getElementById('loading-overlay').style.display = 'none';
    }
</script>
